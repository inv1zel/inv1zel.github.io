<title>Ретро-портфолио</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  /* Layout: fixed full-screen WebGL canvas, tall scroll track drives the camera dolly */
  :root {
    --void: #050506;
    --phosphor: #b9c7b4;
    --amber: #ffb766;
    --dim: #6c6a60;
    --pixel: "Press Start 2P", "Courier New", monospace;
    color-scheme: dark;
  }
  html, body { background: var(--void); color: var(--phosphor); }
  body { font-family: var(--pixel); }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  body.os-on #scene, body.os-on .fx, body.os-on .hint { visibility: hidden; }
  #track { height: 520vh; }

  .fx { position: fixed; inset: 0; pointer-events: none; }
  .vignette { background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,.75) 100%); }
  .grain { opacity: .07; mix-blend-mode: screen; animation: grain .4s steps(4) infinite; }
  @keyframes grain {
    0% { background-position: 0 0 } 25% { background-position: -40px 20px }
    50% { background-position: 30px -50px } 75% { background-position: -20px -10px }
  }

  .hint {
    position: fixed; left: 0; right: 0;
    bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; justify-items: center; gap: 14px;
    font-size: 10px; letter-spacing: .08em; color: var(--dim);
    text-align: center; pointer-events: none; transition: opacity .4s;
  }
  .hint .arrow { color: var(--amber); animation: bob 1.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(6px) } }

  #loader {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: var(--void); font-size: 12px; color: var(--dim);
    transition: opacity .8s;
  }
  #loader.gone { opacity: 0; pointer-events: none; }
  #loader span::after { content: "_"; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0 } }

  @media (prefers-reduced-motion: reduce) {
    .grain, .hint .arrow { animation: none; }
  }

  /* ================= inv1zel.log: the OS inside the CRT =================
     Layout: desktop fills the tube, icon column left, Motif-style panel at the bottom,
     floating bevelled windows above. Single committed look (no light/dark split). */
  #os {
    --desk: #141517;
    --desk-dot: #1c1d20;
    --chrome: #c6c2b6;
    --chrome-hi: #f3f0e7;
    --chrome-lo: #807b6d;
    --chrome-dk: #2b2923;
    --paper: #f6f4ec;
    --ink: #17160f;
    --title-a: #1b3a6b;
    --title-b: #3f74a8;
    --title-off: #8d897d;
    --sel: #1b3a6b;
    --term: #0c100d;
    --term-ink: #b9e0b2;
    --warn: #b8322a;
    --ui: Tahoma, Verdana, "DejaVu Sans", "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", monospace;
    --badge: "Pixelify Sans", Tahoma, sans-serif;
    position: fixed; inset: 0; z-index: 50;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    font-family: var(--ui); font-size: 12px; color: var(--ink);
    background: #000; overflow: hidden;
    opacity: 1; transition: opacity .5s;
  }
  #os.leaving { opacity: 0; }
  #os [hidden], #os[hidden] { display: none !important; }

  /* boot log */
  .os-boot {
    position: absolute; inset: 0; background: #000; color: #c9c9c9;
    font: 13px/1.45 var(--mono);
    padding: max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px));
    overflow: hidden; white-space: pre-wrap;
  }
  .os-boot .ok { color: #5fd35f; }
  .os-boot .hl { color: #fff; }
  .os-weave {   /* the X11 root window stipple, seen for a blink before the WM paints */
    position: absolute; inset: 0;
    background: repeating-conic-gradient(#000 0 25%, #888 0 50%) 0 0 / 4px 4px;
  }

  /* desktop */
  .os-desk {
    position: absolute; inset: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr);
    background:
      radial-gradient(var(--desk-dot) 1px, transparent 1.5px) 0 0 / 6px 6px,
      var(--desk);
  }
  .os-area { position: relative; min-height: 0; overflow: hidden; }
  .os-icons {
    position: absolute; top: 14px; left: max(14px, env(safe-area-inset-left, 0px));
    display: grid; gap: 10px; justify-items: center; z-index: 1;
  }
  .os-icon {
    width: 84px; display: grid; justify-items: center; gap: 4px;
    background: none; border: 1px dotted transparent; padding: 6px 2px;
    color: #fff; font: 12px var(--ui); text-shadow: 1px 1px 0 #000; cursor: default;
  }
  .os-icon svg { width: 36px; height: 36px; image-rendering: pixelated; }
  .os-icon span { padding: 1px 3px; }
  .os-icon.sel span, .os-icon:focus-visible span { background: var(--sel); text-shadow: none; }
  .os-icon:focus-visible { outline: none; border-color: #fff; }
  .os-wall { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .os-wallmark {
    position: absolute; right: max(22px, env(safe-area-inset-right, 0px)); bottom: 18px;
    font: 11px var(--mono); color: rgba(210,212,216,.42); text-align: right; letter-spacing: .18em;
    text-transform: uppercase; pointer-events: none;
  }
  .os-wallmark b {   /* Y2K chrome lettering with a travelling glint */
    display: block; font: 600 clamp(30px, 6vw, 56px)/1 var(--badge); letter-spacing: .02em; text-transform: none;
    background: linear-gradient(180deg, #ffffff 0%, #d4d6da 38%, #55585e 50%, #b9bcc2 62%, #f2f3f5 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 8px rgba(255,255,255,.12)) drop-shadow(0 2px 0 rgba(0,0,0,.7));
    position: relative; margin-bottom: 6px;
  }
  .os-wallmark b::after {
    content: attr(data-text); position: absolute; inset: 0;
    background: linear-gradient(100deg, transparent 40%, rgba(255,255,255,.95) 50%, transparent 60%) -150% 0 / 250% 100% no-repeat;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: glint 5s ease-in-out infinite;
  }
  @keyframes glint { 0%, 55% { background-position: -150% 0 } 85%, 100% { background-position: 250% 0 } }

  /* bevel primitives */
  .bv { border: 2px solid; border-color: var(--chrome-hi) var(--chrome-dk) var(--chrome-dk) var(--chrome-hi); }
  .bv-in { border: 2px solid; border-color: var(--chrome-lo) var(--chrome-hi) var(--chrome-hi) var(--chrome-lo); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--chrome); color: var(--ink); font: 12px var(--ui);
    padding: 4px 12px; min-height: 26px; cursor: pointer; text-decoration: none;
    border: 2px solid; border-color: var(--chrome-hi) var(--chrome-dk) var(--chrome-dk) var(--chrome-hi);
  }
  .btn:active, .btn.on { border-color: var(--chrome-dk) var(--chrome-hi) var(--chrome-hi) var(--chrome-dk); }
  .btn:focus-visible { outline: 1px dotted var(--ink); outline-offset: -5px; }
  .btn.primary { font-weight: bold; }

  /* panel */
  .os-panel {
    display: flex; align-items: stretch; gap: 4px; background: var(--chrome);
    border-top: 2px solid var(--chrome-hi);
    padding: 3px max(4px, env(safe-area-inset-right, 0px)) calc(3px + env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px));
    position: relative; z-index: 9000;
  }
  .os-start { font: 13px var(--badge); padding-inline: 10px; gap: 7px; }
  .os-start i { width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffffff, #b8bbc0 45%, #3c3f44 100%); box-shadow: 0 0 4px rgba(255,255,255,.5); }
  .os-tasks { flex: 1; display: flex; gap: 3px; min-width: 0; overflow: hidden; }
  .os-tasks .btn { justify-content: flex-start; flex: 0 1 170px; min-width: 0; padding-inline: 8px; }
  .os-tasks .btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .os-tasks .btn svg { width: 16px; height: 16px; flex: none; }
  .os-tray { display: flex; align-items: center; gap: 10px; padding-inline: 10px; font-variant-numeric: tabular-nums; }
  .os-menu {
    position: absolute; left: max(4px, env(safe-area-inset-left, 0px)); bottom: calc(100% + 1px);
    background: var(--chrome); min-width: 230px; display: grid; padding: 2px;
  }
  .os-menu .side {
    position: absolute; left: 0; top: 0; bottom: 0; width: 24px; background: linear-gradient(var(--title-b), var(--title-a));
    color: #fff; font: 13px var(--badge); writing-mode: vertical-rl; transform: rotate(180deg);
    display: flex; align-items: center; padding: 8px 0; letter-spacing: .1em;
  }
  .os-menu button {
    display: flex; align-items: center; gap: 10px; background: none; border: 0; text-align: left;
    font: 12px var(--ui); padding: 7px 14px 7px 34px; cursor: pointer; color: var(--ink);
  }
  .os-menu button svg { width: 20px; height: 20px; }
  .os-menu button:hover, .os-menu button:focus-visible { background: var(--sel); color: #fff; outline: none; }
  .os-menu hr { border: 0; border-top: 1px solid var(--chrome-lo); border-bottom: 1px solid var(--chrome-hi); margin: 3px 4px 3px 30px; }

  /* windows */
  .win {
    position: absolute; display: flex; flex-direction: column; background: var(--chrome);
    border: 2px solid; border-color: var(--chrome-hi) var(--chrome-dk) var(--chrome-dk) var(--chrome-hi);
    box-shadow: 1px 1px 0 #000, 6px 8px 0 rgba(0,0,0,.25);
    padding: 2px; min-width: 0; box-sizing: border-box;
    animation: winIn .16s steps(3);
  }
  @keyframes winIn { from { transform: scale(.92); opacity: .4 } }
  .win.max { left: 0 !important; top: 0 !important; width: 100% !important; height: 100% !important; box-shadow: none; }
  .win[hidden] { display: none !important; }
  .win-bar {
    display: flex; align-items: center; gap: 6px; height: 22px; padding: 0 2px 0 5px;
    background: var(--title-off); color: #e9e6dc; font-weight: bold; user-select: none; touch-action: none;
  }
  .win.active .win-bar { background: linear-gradient(90deg, var(--title-a), var(--title-b)); color: #fff; }
  .win-bar svg { width: 16px; height: 16px; flex: none; }
  .win-title { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .win-btns { display: flex; gap: 2px; }
  .win-btns button {
    width: 18px; height: 16px; padding: 0; background: var(--chrome); cursor: pointer;
    border: 2px solid; border-color: var(--chrome-hi) var(--chrome-dk) var(--chrome-dk) var(--chrome-hi);
    display: grid; place-items: center; color: var(--ink);
  }
  .win-btns button:active { border-color: var(--chrome-dk) var(--chrome-hi) var(--chrome-hi) var(--chrome-dk); }
  .win-btns svg { width: 8px; height: 8px; }
  .win-menu { display: flex; gap: 2px; padding: 2px 2px 3px; }
  .win-menu span { padding: 1px 6px; }
  .win-menu span::first-letter { text-decoration: underline; }
  .win-body { flex: 1; min-height: 0; overflow: auto; }
  .win-status { display: flex; gap: 3px; padding-top: 3px; }
  .win-status span { flex: 1; padding: 1px 6px; border: 1px solid; border-color: var(--chrome-lo) var(--chrome-hi) var(--chrome-hi) var(--chrome-lo); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .win-status span:last-child { flex: 0 0 auto; }

  .paper { background: var(--paper); }
  .sunken { border: 2px solid; border-color: var(--chrome-lo) var(--chrome-hi) var(--chrome-hi) var(--chrome-lo); box-shadow: inset 1px 1px 0 var(--chrome-dk); }

  /* whoami */
  .who { display: grid; grid-template-columns: auto 1fr; gap: 18px; padding: 16px; background: var(--term); color: var(--term-ink); font: 13px/1.55 var(--mono); min-height: 100%; }
  .who pre { margin: 0; color: #ffb766; font: 12px/1.15 var(--mono); }
  .who-main { min-width: 0; max-width: 62ch; }
  .who .p { color: #6fb3ff; }
  .who .p b { color: var(--term-ink); font-weight: normal; }
  .who h2 { margin: 6px 0 0; font: 22px var(--badge); color: #fff; text-wrap: balance; }
  .who .role { margin: 0 0 12px; color: #9bb59a; }
  .who p { margin: 0 0 10px; }
  .who ul { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 2px; }
  .who li { display: grid; grid-template-columns: minmax(0, 15ch) auto; gap: 12px; }
  .who .bar { color: #5fd35f; letter-spacing: -.02em; white-space: pre; }
  .who .cur::after { content: "█"; animation: blink 1s steps(1) infinite; }

  /* files */
  .fm { display: grid; grid-template-rows: auto 1fr; height: 100%; gap: 3px; }
  .fm-tools { display: flex; gap: 3px; align-items: center; }
  .fm-tools .btn { padding-inline: 8px; }
  .fm-tools .btn:disabled { color: var(--chrome-lo); text-shadow: 1px 1px 0 var(--chrome-hi); cursor: default; }
  .fm-path { flex: 1; min-width: 0; background: var(--paper); padding: 3px 6px; font: 12px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fm-main { display: grid; grid-template-columns: 196px 1fr; gap: 3px; min-height: 0; }
  .fm-tree { background: var(--paper); padding: 6px 4px; overflow: auto; font-size: 12px; }
  .fm-tree button { display: flex; align-items: center; gap: 4px; width: 100%; background: none; border: 0; padding: 2px 4px; font: 12px var(--ui); color: var(--ink); cursor: pointer; text-align: left; }
  .fm-tree button svg { width: 16px; height: 16px; flex: none; }
  .fm-tree button.cur { background: var(--sel); color: #fff; }
  .fm-tree .d1 { padding-left: 14px; } .fm-tree .d2 { padding-left: 24px; } .fm-tree .d3 { padding-left: 34px; }
  .fm-view { background: var(--paper); overflow: auto; min-width: 0; }
  .fm-grid { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px; padding: 12px; }
  .fm-grid .os-icon { color: var(--ink); text-shadow: none; width: 112px; }
  .os-icon span { max-width: 100%; overflow-wrap: anywhere; text-align: center; }
  .fm-grid .os-icon.sel span, .fm-grid .os-icon:focus-visible span { color: #fff; }
  .fm-grid .os-icon:focus-visible { border-color: var(--ink); }

  .proj { padding: 14px; display: grid; gap: 14px; }
  .shot { aspect-ratio: 16 / 9; max-width: 100%; width: 460px; border: 2px solid; border-color: var(--chrome-lo) var(--chrome-hi) var(--chrome-hi) var(--chrome-lo);
    display: grid; grid-template-rows: auto 1fr; background: hsl(var(--h) 35% 22%); overflow: hidden; }
  .shot-bar { display: flex; gap: 4px; align-items: center; padding: 4px 6px; background: #d8d4c8; font: 10px var(--mono); color: #555; }
  .shot-bar i { width: 7px; height: 7px; background: #9a9688; border-radius: 50%; }
  .shot-bar span { margin-left: 6px; background: #fff; padding: 1px 6px; flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; }
  .shot-body { display: grid; align-content: center; justify-items: start; gap: 8px; padding: 6% 8%;
    background: linear-gradient(135deg, hsl(var(--h) 55% 32%), hsl(calc(var(--h) + 40) 50% 18%)); color: #fff; }
  .shot-body b { font: clamp(18px, 4vw, 30px) var(--badge); }
  .shot-body s { display: block; height: 6px; width: 60%; background: rgba(255,255,255,.35); text-decoration: none; }
  .shot-body s + s { width: 40%; }
  .proj h3 { margin: 0; font: 20px var(--badge); }
  .proj dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; }
  .proj dt { color: #5d5a50; }
  .proj dd { margin: 0; display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { font: 11px var(--mono); padding: 0 5px; border: 1px solid var(--chrome-lo); background: #ebe7da; }
  .proj p { margin: 0; max-width: 62ch; line-height: 1.55; }
  .proj-points { margin: 0; padding-left: 18px; max-width: 64ch; display: grid; gap: 8px; line-height: 1.5; }
  .proj-points li::marker { color: var(--chrome-lo); }
  /* gold-on-black mock of the Aurum Dental hero, standing in for a screenshot */
  .shot.gold .shot-body { background: radial-gradient(ellipse at 70% 40%, #2a2112, #0b0906 70%); justify-items: start; }
  .shot.gold small { font: 10px var(--mono); letter-spacing: .25em; text-transform: uppercase; color: #b89a5e; }
  .shot.gold b { font: italic 600 clamp(22px, 5vw, 40px) Georgia, "Times New Roman", serif;
    background: linear-gradient(180deg, #f7e3a8, #c9a24e 55%, #8a6a2a); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .shot.carbon .shot-body { justify-items: start;
    background: linear-gradient(120deg, rgba(255,255,255,.07), transparent 40%),
      repeating-linear-gradient(45deg, #1b1c1f 0 4px, #141517 4px 8px), #151618; }
  .shot.carbon small { font: 10px var(--mono); letter-spacing: .3em; text-transform: uppercase; color: #8d9096; }
  .shot.carbon b { font: 600 clamp(22px, 5vw, 40px) var(--ui); letter-spacing: .18em; text-transform: uppercase;
    background: linear-gradient(180deg, #ffffff, #a9adb4 50%, #4f5258 52%, #d6d9de); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .shot.carbon em { font: 11px var(--ui); font-style: normal; color: #e6e7ea; border: 1px solid #6d7076; padding: 5px 14px; letter-spacing: .1em; text-transform: uppercase; }
  .shot.nocturne .shot-body { justify-items: start;
    background: radial-gradient(ellipse at 75% 30%, rgba(120,110,160,.35), transparent 55%), radial-gradient(ellipse at 20% 90%, rgba(60,50,80,.5), transparent 60%), #0c0b10; }
  .shot.nocturne small { font: 10px var(--mono); letter-spacing: .3em; text-transform: uppercase; color: #8e8a99; }
  .shot.nocturne b { font: 300 italic clamp(26px, 6vw, 48px)/1 Georgia, "Times New Roman", serif; color: #ece8df; letter-spacing: .01em; }
  .shot.nocturne em { font: 10px var(--mono); font-style: normal; color: #0c0b10; background: #ece8df; border-radius: 999px; padding: 5px 12px; letter-spacing: .08em; text-transform: uppercase; }
  .shot.gold em { font: 11px var(--ui); font-style: normal; color: #0b0906; background: linear-gradient(#e9cd85, #b8913f); padding: 5px 12px; }
  .proj .acts { display: flex; flex-wrap: wrap; gap: 6px; }

  /* mail */
  .mail { display: grid; grid-template-columns: 150px 1fr; grid-template-rows: auto 1fr; gap: 3px; height: 100%; }
  .mail-tools { grid-column: 1 / -1; display: flex; gap: 3px; }
  .mail-folders { background: var(--paper); padding: 4px; display: grid; align-content: start; gap: 1px; }
  .mail-folders div { padding: 3px 6px; display: flex; justify-content: space-between; }
  .mail-folders .cur { background: var(--sel); color: #fff; }
  .mail-right { display: grid; grid-template-rows: auto 1fr; gap: 3px; min-width: 0; min-height: 0; }
  .mail-list { background: var(--paper); }
  .mail-list table { width: 100%; border-collapse: collapse; }
  .mail-list th { background: var(--chrome); text-align: left; font-weight: normal; padding: 2px 6px; border: 1px solid; border-color: var(--chrome-hi) var(--chrome-dk) var(--chrome-dk) var(--chrome-hi); }
  .mail-list td { padding: 3px 6px; white-space: nowrap; }
  .mail-list tr.cur td { background: var(--sel); color: #fff; }
  .mail-list tr.unread td { font-weight: bold; }
  .mail-msg { background: var(--paper); overflow: auto; min-width: 0; }
  .mail-head { padding: 8px 12px; border-bottom: 1px solid var(--chrome-lo); display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
  .mail-head dt { color: #5d5a50; } .mail-head dd { margin: 0; }
  .mail-text { padding: 12px; max-width: 62ch; line-height: 1.55; }
  .mail-text p { margin: 0 0 10px; }
  .contacts { display: grid; gap: 6px; margin: 4px 0 14px; }
  .contact { display: grid; grid-template-columns: 90px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 8px; background: #ebe7da; border: 1px solid var(--chrome-lo); }
  .contact dt { color: #5d5a50; } .contact dd { margin: 0; font: 13px var(--mono); overflow-wrap: anywhere; user-select: all; }
  .contact dd.nomail { font: italic 12px var(--ui); color: #5d5a50; user-select: auto; }
  .contact a { color: var(--title-a); }

  .dlg { display: grid; grid-template-columns: auto 1fr; gap: 14px; padding: 16px; align-items: start; }
  .dlg svg { width: 32px; height: 32px; }
  .dlg p { margin: 0 0 8px; line-height: 1.5; }
  .dlg .acts { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 6px; }

  /* browser chrome */
  .br { display: grid; grid-template-rows: auto auto auto 1fr; gap: 3px; height: 100%; box-sizing: border-box; }
  .br-tools { display: flex; gap: 3px; align-items: center; flex-wrap: wrap; }
  .br-tools .btn { padding-inline: 8px; }
  .br-tools .btn:disabled { color: var(--chrome-lo); text-shadow: 1px 1px 0 var(--chrome-hi); cursor: default; }
  .br-throb { margin-left: auto; width: 32px; height: 28px; display: grid; place-items: center; background: #111; }
  .br-throb i { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #9a9da3 45%, #2b2d31 100%); }
  .br-throb.busy i { background: conic-gradient(#fff, #55585e, #fff); animation: spin .5s linear infinite; }
  @keyframes spin { to { transform: rotate(1turn) } }
  .br-addr { display: flex; gap: 4px; align-items: center; }
  .br-addr label { padding: 0 2px 0 4px; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const DESK_Y = 0.77;

  // ---------- grain overlay ----------
  {
    const c = document.createElement("canvas"); c.width = c.height = 128;
    const g = c.getContext("2d"); const img = g.createImageData(128, 128);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = Math.random() * 255; img.data[i] = img.data[i+1] = img.data[i+2] = v; img.data[i+3] = 255;
    }
    g.putImageData(img, 0, 0);
    document.getElementById("grain").style.backgroundImage = `url(${c.toDataURL()})`;
  }

  // ---------- renderer / scene ----------
  const canvas = document.getElementById("scene");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  const coarse = matchMedia("(hover: none)").matches;
  renderer.setPixelRatio(Math.min(devicePixelRatio, coarse ? 1.5 : 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050506);
  scene.fog = new THREE.FogExp2(0x050506, 0.28);

  const camera = new THREE.PerspectiveCamera(42, 1, 0.01, 30);

  // ---------- helpers ----------
  function canvasTex(w, h, draw, repeat) {
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    draw(c.getContext("2d"), w, h);
    const t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
    return t;
  }
  function noise(g, w, h, amt) {
    const img = g.getImageData(0, 0, w, h);
    for (let i = 0; i < img.data.length; i += 4) {
      const n = (Math.random() - 0.5) * amt;
      img.data[i] += n; img.data[i+1] += n; img.data[i+2] += n;
    }
    g.putImageData(img, 0, 0);
  }
  function mesh(geo, mat, x, y, z, parent) {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z);
    m.castShadow = m.receiveShadow = true;
    (parent || scene).add(m);
    return m;
  }
  const box = (w, h, d, mat, x, y, z, parent) => mesh(new THREE.BoxGeometry(w, h, d), mat, x, y, z, parent);
  const std = (color, rough = 0.7, metal = 0, extra = {}) =>
    new THREE.MeshStandardMaterial(Object.assign({ color, roughness: rough, metalness: metal }, extra));

  // ---------- materials ----------
  const beige = std(0xcdc3a2, 0.55);          // aged ABS plastic
  const beigeDark = std(0xa99f80, 0.6);
  const blackPlastic = std(0x151515, 0.5);
  const slotBlack = std(0x050505, 0.9);

  const woodTex = canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = "#4a2f1c"; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 140; i++) {
      const y = Math.random() * h;
      g.strokeStyle = `rgba(${20 + Math.random()*40},${10 + Math.random()*20},5,${0.15 + Math.random()*0.25})`;
      g.lineWidth = 1 + Math.random() * 3;
      g.beginPath();
      for (let x = 0; x <= w; x += 16) g.lineTo(x, y + Math.sin(x * 0.01 + i) * 6);
      g.stroke();
    }
    noise(g, w, h, 18);
  });
  const wood = std(0xffffff, 0.65, 0, { map: woodTex });

  const wallTex = canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = "#3a3d33"; g.fillRect(0, 0, w, h);
    for (let x = 0; x < w; x += 32) {          // soviet-flat wallpaper stripes
      g.fillStyle = "rgba(0,0,0,.12)"; g.fillRect(x, 0, 14, h);
      g.fillStyle = "rgba(255,240,200,.04)"; g.fillRect(x + 20, 0, 3, h);
    }
    for (let i = 0; i < 6; i++) {               // water stains
      const gr = g.createRadialGradient(Math.random()*w, Math.random()*h, 0, Math.random()*w, Math.random()*h, 80 + Math.random()*120);
      gr.addColorStop(0, "rgba(60,45,20,.18)"); gr.addColorStop(1, "rgba(60,45,20,0)");
      g.fillStyle = gr; g.fillRect(0, 0, w, h);
    }
    noise(g, w, h, 14);
  }, [4, 2]);
  const wall = std(0xffffff, 0.95, 0, { map: wallTex });

  const floorTex = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = "#231c16"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#1b1511";
    for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) if ((x + y) % 2) g.fillRect(x*32, y*32, 32, 32);
    noise(g, w, h, 16);
  }, [10, 10]);
  const floorMat = std(0xffffff, 0.85, 0, { map: floorTex });

  // ---------- room ----------
  const floor = mesh(new THREE.PlaneGeometry(12, 12), floorMat, 0, 0, 0);
  floor.rotation.x = -Math.PI / 2;
  mesh(new THREE.PlaneGeometry(8, 3.2), wall, 0, 1.6, -0.55);
  const leftWall = mesh(new THREE.PlaneGeometry(6, 3.2), wall, -1.7, 1.6, 2.4);
  leftWall.rotation.y = Math.PI / 2;
  // skirting board
  box(8, 0.08, 0.02, std(0x2a1d14, 0.7), 0, 0.04, -0.54);

  // ---------- desk ----------
  box(1.7, 0.04, 0.82, wood, 0, DESK_Y - 0.02, -0.11);
  box(0.03, DESK_Y - 0.04, 0.78, wood, -0.82, (DESK_Y - 0.04) / 2, -0.11);
  box(0.03, DESK_Y - 0.04, 0.78, wood, 0.82, (DESK_Y - 0.04) / 2, -0.11);
  box(1.6, 0.35, 0.02, wood, 0, DESK_Y - 0.22, -0.48);       // modesty panel
  box(0.4, 0.14, 0.7, wood, 0.6, DESK_Y - 0.11, -0.12);      // drawer
  box(0.08, 0.015, 0.02, std(0x8a7a55, 0.3, 0.8), 0.6, DESK_Y - 0.11, 0.235);

  // ---------- CRT monitor ----------
  const monitor = new THREE.Group();
  monitor.position.set(0, DESK_Y, 0.05);
  scene.add(monitor);
  const BODY_Y = 0.245;
  mesh(new THREE.CylinderGeometry(0.11, 0.12, 0.015, 32), beigeDark, 0, 0.0075, -0.12, monitor);
  box(0.09, 0.05, 0.1, beigeDark, 0, 0.04, -0.12, monitor);
  box(0.42, 0.38, 0.07, beige, 0, BODY_Y, 0, monitor);                 // front bezel
  box(0.37, 0.33, 0.2, beige, 0, BODY_Y + 0.005, -0.13, monitor);      // tube housing
  box(0.27, 0.23, 0.14, beige, 0, BODY_Y + 0.015, -0.29, monitor);     // neck
  // rear vents
  for (let i = 0; i < 9; i++) box(0.2, 0.004, 0.002, slotBlack, 0, BODY_Y + 0.11 - i * 0.012, -0.361, monitor);
  // recessed screen frame
  mesh(new THREE.PlaneGeometry(0.36, 0.285), std(0x2a2720, 0.8), 0, BODY_Y + 0.015, 0.0352, monitor);

  // screen texture (live canvas)
  const scr = document.createElement("canvas"); scr.width = 640; scr.height = 480;
  const sg = scr.getContext("2d");
  const screenTex = new THREE.CanvasTexture(scr);
  screenTex.encoding = THREE.sRGBEncoding;
  const SW = 0.33, SH = 0.25;
  const screenGeo = new THREE.PlaneGeometry(SW, SH, 24, 18);
  {
    const pos = screenGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i) / (SW / 2), y = pos.getY(i) / (SH / 2);
      pos.setZ(i, 0.011 * (1 - x * x * 0.6) * (1 - y * y * 0.6));
    }
    screenGeo.computeVertexNormals();
  }
  const screen = new THREE.Mesh(screenGeo, new THREE.MeshBasicMaterial({ map: screenTex, color: 0xd8d8d8, toneMapped: false }));
  screen.position.set(0, BODY_Y + 0.015, 0.036);
  monitor.add(screen);
  const SCREEN_WORLD = new THREE.Vector3(0, DESK_Y + BODY_Y + 0.015, 0.05 + 0.036 + 0.011);

  // bezel controls
  const ledMon = new THREE.MeshStandardMaterial({ color: 0x113311, emissive: 0x33ff55, emissiveIntensity: 1.6 });
  box(0.024, 0.012, 0.006, beigeDark, 0.17, BODY_Y - 0.165, 0.036, monitor);
  box(0.006, 0.004, 0.003, ledMon, 0.14, BODY_Y - 0.165, 0.036, monitor);

    Object.assign(el.style, { left: x + "px", top: y + "px", width: W + "px", height: H + "px" });

      if (el.classList.contains("dlg-win")) {

        if (!el.classList.contains("max")) { el.classList.add("max"); el.dataset.automax = "1"; }
        return;
      } else if (el.dataset.automax) {
        el.classList.remove("max"); delete el.dataset.automax;
      }
      if (el.classList.contains("max")) return;
      if (el.style.width !== "auto") el.style.width = Math.min(parseFloat(el.style.width) || el.offsetWidth, A.width - 16) + "px";
      if (el.style.height !== "auto") el.style.height = Math.min(parseFloat(el.style.height) || el.offsetHeight, A.height - 16) + "px";
      el.style.left = Math.max(8, Math.min(el.offsetLeft, A.width - el.offsetWidth - 8)) + "px";

    const bar = $(".win-bar", el);
    let sx, sy, ox, oy, dragging = false;
    bar.addEventListener("pointerdown", e => {
      if (e.target.closest("button") || el.classList.contains("max") || e.button !== 0) return;
      dragging = true; bar.setPointerCapture(e.pointerId);
      sx = e.clientX; sy = e.clientY; ox = el.offsetLeft; oy = el.offsetTop;
    });
    bar.addEventListener("pointermove", e => {
      if (!dragging) return;
      const A = area.getBoundingClientRect();
      const nx = Math.max(80 - el.offsetWidth, Math.min(A.width - 80, ox + e.clientX - sx));
      const ny = Math.max(0, Math.min(A.height - 24, oy + e.clientY - sy));
      el.style.left = nx + "px"; el.style.top = ny + "px";

        btn.addEventListener("click", () => {
          if (ac) return stop();
          try {
            ac = new (window.AudioContext || window.webkitAudioContext)();
            const E5 = 659.25, B4 = 493.88, C5 = 523.25, D5 = 587.33, A4 = 440;
            const tune = [[E5,1],[B4,.5],[C5,.5],[D5,1],[C5,.5],[B4,.5],[A4,1],[A4,.5],[C5,.5],[E5,1],[D5,.5],[C5,.5],[B4,1.5],[C5,.5],[D5,1],[E5,1],[C5,1],[A4,1],[A4,2]];
            let t = ac.currentTime + 0.05;
            const beat = 0.24;
            for (let rep = 0; rep < 2; rep++) for (const [f0, d] of tune) {
              const o = ac.createOscillator(), g = ac.createGain();
              o.type = "square"; o.frequency.value = f0;
              g.gain.setValueAtTime(0.045, t); g.gain.setValueAtTime(0, t + d * beat * 0.9);

            }
            btn.textContent = "■ Выключить музыку";
          } catch (err) { btn.textContent = "Звуковая карта не найдена"; }
        });
        return () => { clearInterval(iv); stop(); };

    };

  // Minesweeper first shipped in 1990; the intro compares that to the player's birth year
  const MINES_YEAR = 1990;
  const years = n => { const a = Math.abs(n) % 100, b = a % 10; return n + " " + (a > 10 && a < 20 ? "лет" : b === 1 ? "год" : b > 1 && b < 5 ? "года" : "лет"); };
  function ageVerdict(born) {
    const now = new Date().getFullYear();
    if (born === "secret") return "Возраст засекречен. Сапёр уважает таинственных.";
    if (!(born >= 1900 && born <= now)) return null;
    const d = born - MINES_YEAR;
    if (d > 0) return `Эта игра старше тебя на ${years(d)}. Уважай старших.`;
    if (d === 0) return "Вы с Сапёром ровесники. Можно на «ты».";
    if (born >= 1960) return `Ты старше Сапёра на ${years(-d)}. Покажи ему, кто тут главный.`;
    return `Ты старше Сапёра на ${years(-d)} и помнишь компьютеры размером с комнату. Для тебя это детская забава.`;
  }

  function minesGame(rec, verdict) {
    const N = 9, M = 10;
    let cells, started, over, flags, opened, timer, secs, flagMode = false;
    rec.body.innerHTML = `<div class="mines">
      <div class="mines-top sunken"><span class="led" data-left></span><button class="btn face" data-face aria-label="Новая игра">:)</button><span class="led" data-time></span></div>
      <div class="mines-grid sunken"></div>
      ${touchUI ? `<button class="btn" data-mode>Режим: открывать</button>` : ""}
    </div>`;
    const grid = $(".mines-grid", rec.body), left = $("[data-left]", rec.body), time = $("[data-time]", rec.body);
    const face = $("[data-face]", rec.body), modeBtn = $("[data-mode]", rec.body);
    const pad = n => String(Math.max(0, Math.min(999, n))).padStart(3, "0");
    const nb = i => {
      const x = i % N, y = (i / N) | 0, r = [];
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const nx = x + dx, ny = y + dy;
        if ((dx || dy) && nx >= 0 && ny >= 0 && nx < N && ny < N) r.push(ny * N + nx);
      }
      return r;
    };
    function reset() {
      clearInterval(timer);
      started = over = false; flags = opened = secs = 0;
      cells = Array.from({ length: N * N }, () => ({ mine: false, n: 0, open: false, flag: false }));
      grid.innerHTML = cells.map((_, i) => `<button class="mc" data-i="${i}" aria-label="Клетка ${i % N + 1}, ${((i / N) | 0) + 1}"></button>`).join("");
      face.textContent = ":)"; left.textContent = pad(M); time.textContent = pad(0);
      status(rec, verdict || (touchUI ? "Переключи режим, чтобы ставить флажки" : "ЛКМ — открыть, ПКМ — флажок"), "");
    }
    function plant(safe) {
      const keep = [safe, ...nb(safe)];
      let k = 0;
      while (k < M) { const i = (Math.random() * N * N) | 0; if (cells[i].mine || keep.includes(i)) continue; cells[i].mine = true; k++; }
      cells.forEach((c, i) => { c.n = nb(i).filter(j => cells[j].mine).length; });
    }
    function openCell(i) {
      const c = cells[i]; if (c.open || c.flag || over) return;
      c.open = true; opened++;
      const el = grid.children[i]; el.classList.add("open");
      if (c.mine) return lose(i);
      if (c.n) { el.textContent = c.n; el.dataset.n = c.n; } else nb(i).forEach(openCell);
    }
    function lose(i) {
      over = true; clearInterval(timer); face.textContent = "X(";
      cells.forEach((c, j) => {
        const el = grid.children[j];
        if (c.mine && !c.flag) el.classList.add("open", "mine");
        if (!c.mine && c.flag) { el.classList.remove("flag"); el.textContent = "×"; }
      });
      grid.children[i].classList.add("boom");
      status(rec, "Бум! Нажми на смайлик, чтобы сыграть ещё", "");
    }
    function checkWin() {
      if (over || opened !== N * N - M) return;
      over = true; clearInterval(timer); face.textContent = "B)";
      cells.forEach((c, j) => { if (c.mine) grid.children[j].classList.add("flag"); });
      left.textContent = pad(0);
      status(rec, `Победа за ${secs} с!`, "");
    }
    function act(i, flag) {
      if (over) return;
      const c = cells[i];
      if (flag) {
        if (c.open) return;
        c.flag = !c.flag; flags += c.flag ? 1 : -1;
        grid.children[i].classList.toggle("flag", c.flag); left.textContent = pad(M - flags);
        return;
      }
      if (!started) { started = true; plant(i); timer = setInterval(() => { secs++; time.textContent = pad(secs); }, 1000); }
      if (c.open) { const ns = nb(i); if (c.n && ns.filter(j => cells[j].flag).length === c.n) ns.forEach(openCell); }
      else openCell(i);
      checkWin();
    }
    grid.addEventListener("click", e => { const b = e.target.closest(".mc"); if (b) act(+b.dataset.i, flagMode); });
    grid.addEventListener("contextmenu", e => { e.preventDefault(); const b = e.target.closest(".mc"); if (b) act(+b.dataset.i, !flagMode); });
    grid.addEventListener("pointerdown", e => { if (!over && e.button === 0 && e.target.closest(".mc")) face.textContent = ":O"; });
    const unpress = () => { if (!over) face.textContent = ":)"; };
    addEventListener("pointerup", unpress);
    face.addEventListener("click", reset);
    if (modeBtn) modeBtn.addEventListener("click", () => {
      flagMode = !flagMode; modeBtn.classList.toggle("on", flagMode);
      modeBtn.textContent = flagMode ? "Режим: флажки" : "Режим: открывать";
    });
    rec.onClose = () => { clearInterval(timer); removeEventListener("pointerup", unpress); };
    reset();
  }

  function renderSnake(rec) {
    const G = 20, S = 15, LCD = "#c7d9a7", DIM = "#b9cc98", INK = "#2e3b22";
    rec.body.innerHTML = `<div class="snake">
      <div class="snake-hud"><span>Счёт: <b data-score>0</b></span><span>Рекорд: <b data-best>0</b></span></div>
      <canvas width="${G * S}" height="${G * S}" tabindex="0" aria-label="Игровое поле"></canvas>
      <div class="pad">
        <button class="btn" data-d="0,-1" style="grid-area:1/2" aria-label="Вверх">▲</button>
        <button class="btn" data-d="-1,0" style="grid-area:2/1" aria-label="Влево">◄</button>
        <button class="btn" data-d="0,1" style="grid-area:2/2" aria-label="Вниз">▼</button>
        <button class="btn" data-d="1,0" style="grid-area:2/3" aria-label="Вправо">►</button>
      </div>
    </div>`;
    const cv = $("canvas", rec.body), g = cv.getContext("2d");
    const scoreEl = $("[data-score]", rec.body), bestEl = $("[data-best]", rec.body);
    let best = 0;
    try { best = +localStorage.getItem("inv1zel-snake") || 0; } catch (err) { best = 0; }
    bestEl.textContent = best;
    let snake, dir, nextDir, food, score, state = "idle", timer = 0;

    function reset() {
      snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
      dir = nextDir = { x: 1, y: 0 }; score = 0; scoreEl.textContent = 0; placeFood();
    }
    function placeFood() {
      do food = { x: (Math.random() * G) | 0, y: (Math.random() * G) | 0 };
      while (snake.some(p => p.x === food.x && p.y === food.y));
    }
    function draw() {
      g.fillStyle = LCD; g.fillRect(0, 0, G * S, G * S);
      g.fillStyle = DIM;                                   // ghost pixels of the LCD
      for (let y = 0; y < G; y++) for (let x = 0; x < G; x++) g.fillRect(x * S + 1, y * S + 1, S - 2, S - 2);
      g.fillStyle = INK;
      snake.forEach(p => g.fillRect(p.x * S + 1, p.y * S + 1, S - 2, S - 2));
      g.fillRect(food.x * S + 5, food.y * S + 2, S - 10, S - 4);
      g.fillRect(food.x * S + 2, food.y * S + 5, S - 4, S - 10);
      if (state !== "run") {
        g.fillStyle = "rgba(199,217,167,.9)"; g.fillRect(0, G * S / 2 - 42, G * S, 84);
        g.fillStyle = INK; g.textAlign = "center";
        g.font = "bold 24px 'Pixelify Sans', monospace";
        g.fillText(state === "idle" ? "ЗМЕЙКА" : state === "over" ? "КОНЕЦ ИГРЫ" : "ПАУЗА", G * S / 2, G * S / 2 - 6);
        g.font = "13px 'IBM Plex Mono', monospace";
        g.fillText(touchUI ? "Нажми на поле, чтобы начать" : "Пробел — старт, стрелки — рулить", G * S / 2, G * S / 2 + 22);
      }
    }
    const live = () => { const w = wins.get("snake"); return w && !w.el.hidden && w.el.classList.contains("active") && !os.hidden; };
    function pause() { if (state === "run") { state = "pause"; clearInterval(timer); draw(); } }
    function step() {
      if (!live()) return pause();
      dir = nextDir;
      const h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      if (h.x < 0 || h.y < 0 || h.x >= G || h.y >= G || snake.some(p => p.x === h.x && p.y === h.y)) {
        state = "over"; clearInterval(timer);
        if (score > best) { best = score; bestEl.textContent = best; try { localStorage.setItem("inv1zel-snake", best); } catch (err) { /* no record then */ } }
        status(rec, `Конец игры. Счёт: ${score}`, ""); draw(); return;
      }
      snake.unshift(h);
      if (h.x === food.x && h.y === food.y) { score++; scoreEl.textContent = score; placeFood(); run(); }
      else snake.pop();
      draw();
    }
    function run() { clearInterval(timer); timer = setInterval(step, Math.max(60, 150 - score * 4)); }
    function start() {
      if (state === "run") return pause();
      if (state !== "pause") reset();
      state = "run"; status(rec, "Ешь крестики, не врезайся в стены", ""); run(); draw();
    }
    function turn(dx, dy) {
      if (state !== "run") start();
      if (dx === -dir.x && dy === -dir.y) return;
      nextDir = { x: dx, y: dy };
    }
    const KEYS = { ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1], ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0] };
    const onKey = e => {
      if (!live()) return;
      if (e.code === "Space") { e.preventDefault(); start(); }
      else if (KEYS[e.code]) { e.preventDefault(); turn(...KEYS[e.code]); }
    };
    addEventListener("keydown", onKey);
    $(".pad", rec.body).addEventListener("click", e => { const b = e.target.closest("[data-d]"); if (b) turn(...b.dataset.d.split(",").map(Number)); });
    let sx = 0, sy = 0;
    cv.addEventListener("pointerdown", e => { sx = e.clientX; sy = e.clientY; });
    cv.addEventListener("pointerup", e => {
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) { if (state !== "run") start(); return; }
      if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0); else turn(0, Math.sign(dy));
    });
    rec.onClose = () => { clearInterval(timer); removeEventListener("keydown", onKey); };
    reset(); draw();
    status(rec, touchUI ? "Свайпы или кнопки — рулить" : "Пробел — старт, стрелки или WASD — рулить", "");
  }

  // ---- clock ----
  const clock = $("#osClock");
  const tick = () => { const d = new Date(); clock.textContent = d.toTimeString().slice(0, 5); };
  tick(); setInterval(tick, 10000);

  // ---- boot / exit ----
  const BOOT = [
    `LILO 22.5 boot: <span class='hl'>${OS.host}</span>`,
    `Loading ${OS.host}-2.4.22 ....................`,
    "Uncompressing Linux... Ok, booting the kernel.",
    `Linux version 2.4.22 (root@${OS.host}) (gcc version 3.3.1) #1 Sat Oct 18 03:12:44 MSK 2003`,
    "BIOS-provided physical RAM map: 256MB LOWMEM available.",
    "hda: QUANTUM FIREBALLlct20 20, ATA DISK drive",
    "hdc: CD-ROM 52X, ATAPI CD/DVD-ROM drive",
    "VFS: Mounted root (ext3 filesystem) readonly.",
    "INIT: version 2.85 booting",
    "Checking root filesystem ............... [<span class='ok'>  OK  </span>]",
    "Starting system logger ................. [<span class='ok'>  OK  </span>]",
    "Bringing up interface eth0 ............. [<span class='ok'>  OK  </span>]",
    "Mounting /home/" + ME.login + "/portfolio ......... [<span class='ok'>  OK  </span>]",
    "Starting mail daemon ................... [<span class='ok'>  OK  </span>]",
    `Starting X11 (${OS.wm}) ............... [<span class='ok'>  OK  </span>]`,
  ];
  let booted = false, busy = false, timers = [];
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));

  function chime() {
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state !== "running") { ac.close(); return; }
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
        const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + i * 0.12;
        o.type = "triangle"; o.frequency.value = f;
        g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.08, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.9);
        o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + 1);
      });
    } catch (err) { /* silent machine */ }
  }

  function boot() {
    if (busy) return;
    busy = true;
    os.hidden = false; os.classList.remove("leaving");
    document.documentElement.style.overflow = "hidden";
    RetroOS.covering = true;
    document.body.classList.add("os-on");
    const step = reduceMotion ? 20 : 140;
    if (booted) { showDesk(); return; }
    desk.hidden = true; bootEl.hidden = false; bootEl.innerHTML = "";
    BOOT.forEach((l, i) => later(() => { bootEl.innerHTML += l + "\n"; }, i * step + (i > 2 ? 300 : 0)));
    const t = BOOT.length * step + 700;
    later(() => { bootEl.innerHTML = ""; bootEl.className = "os-weave"; }, t);
    later(() => { bootEl.className = "os-boot"; bootEl.hidden = true; booted = true; showDesk(); chime(); }, t + (reduceMotion ? 50 : 450));
  }
  function showDesk() {
    desk.hidden = false; busy = false;
    wall.start();
    if (!wins.size) openDialog("welcome", "Добро пожаловать", ICON.info,
      `<p>Это мой компьютер. Здесь всё обо мне: работы лежат в «Файлах», связаться можно через «Почту».</p>
       <p>${touchUI ? "Нажми на иконку, чтобы открыть." : "Двойной клик по иконке открывает программу."}</p>`);
  }
  function exit() {
    timers.forEach(clearTimeout); timers = [];
    wall.stop();
    os.classList.add("leaving");
    RetroOS.covering = false;
    document.body.classList.remove("os-on");
    document.documentElement.style.overflow = "";
    window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
    dispatchEvent(new Event("retro-os-exit"));
    setTimeout(() => { os.hidden = true; busy = false; }, 500);
  }

  const RetroOS = window.RetroOS = { boot, exit, covering: false };
  if (location.hash === "#os") { scrollTo(0, document.documentElement.scrollHeight); setTimeout(boot, 50); }
})();
</script>
